<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sfoglia avatar</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0b; color: #fff; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    header { display: flex; align-items: center; gap: 18px; padding: 22px 36px 8px; }
    h1 { margin: 0; font-size: 22px; font-weight: 600; }
    .meta { margin-left: auto; font-size: 18px; color: rgba(255,255,255,.55); }
    .cat { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.45); }
    .stage {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 28px;
      padding: 12px 24px 8px; min-height: 0;
    }
    .nav {
      width: 64px; height: 64px; border: 0; border-radius: 50%;
      background: rgba(255,255,255,.1); color: #fff; font-size: 36px; cursor: pointer;
      flex-shrink: 0;
    }
    .nav:hover, .nav:focus { background: #fff; color: #111; outline: none; }
    .card { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .frame {
      width: min(46vmin, calc(100vw - 200px), 420px);
      aspect-ratio: 1;
      height: auto;
      flex-shrink: 0;
      border-radius: 28px; overflow: hidden;
      background: var(--tile, #2563eb);
      box-shadow: 0 0 0 4px #fff, 0 24px 60px rgba(0,0,0,.55);
      cursor: pointer;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .frame img {
      width: 92%;
      height: 94%;
      object-fit: contain;
      object-position: center bottom;
      display: block;
      pointer-events: none;
      filter:
        drop-shadow(0 0 2px rgba(0,0,0,.9))
        drop-shadow(0 10px 8px rgba(0,0,0,.85))
        drop-shadow(0 28px 24px rgba(0,0,0,.7))
        drop-shadow(0 46px 36px rgba(0,0,0,.45));
    }
    .who { text-align: center; }
    .who b { display: block; font-size: 28px; font-weight: 700; }
    .who span { display: block; margin-top: 4px; font-size: 16px; color: rgba(255,255,255,.5); }
    .mods {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
    }
    .mods label { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.45); }
    .swatch {
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; padding: 0; flex-shrink: 0;
    }
    .swatch.on { border-color: #fff; box-shadow: 0 0 0 2px #000, 0 0 0 4px #fff; }
    .custom {
      width: 28px; height: 28px; border: 2px solid rgba(255,255,255,.35); border-radius: 50%;
      padding: 0; background: transparent; cursor: pointer; overflow: hidden;
    }
    .custom::-webkit-color-swatch-wrapper { padding: 0; }
    .custom::-webkit-color-swatch { border: 0; border-radius: 50%; }
    .strip {
      display: flex; gap: 8px; padding: 10px 36px 14px; overflow-x: auto;
      scrollbar-width: none;
    }
    .strip::-webkit-scrollbar { display: none; }
    .thumb {
      width: 64px; height: 64px; border-radius: 12px; overflow: hidden;
      border: 2px solid transparent; cursor: pointer; flex-shrink: 0; padding: 0;
      background: var(--tile, #2563eb);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .thumb.on { border-color: #fff; }
    .thumb img {
      width: 90%; height: 92%; object-fit: contain; object-position: center bottom; display: block;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.9)) drop-shadow(0 8px 6px rgba(0,0,0,.7));
    }
    .hint { padding: 0 36px 18px; color: rgba(255,255,255,.4); font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Avatar a mezzo busto</h1>
    <span class="cat" id="cat"></span>
    <span class="meta" id="meta">1 / 6</span>
  </header>
  <div class="stage">
    <button class="nav" id="prev" aria-label="Precedente">‹</button>
    <div class="card">
      <div class="frame" id="frame"><img id="photo" alt="" /></div>
      <div class="who"><b id="name"></b><span id="show"></span></div>
      <div class="mods" id="mods">
        <label>Colore</label>
      </div>
    </div>
    <button class="nav" id="next" aria-label="Successiva">›</button>
  </div>
  <div class="strip" id="strip"></div>
  <p class="hint">Personaggio ritagliato, ombra sotto, colore dal modificatore. Frecce o spazio per cambiare avatar.</p>
  <script>
    var COLORS = [
      { hex: '#2563eb', label: 'Blu' },
      { hex: '#db2777', label: 'Rosa' },
      { hex: '#16a34a', label: 'Verde' },
      { hex: '#ca8a04', label: 'Giallo' },
      { hex: '#7c3aed', label: 'Viola' },
      { hex: '#ea580c', label: 'Arancio' },
      { hex: '#0d9488', label: 'Teal' },
      { hex: '#e11d48', label: 'Rosso' }
    ];
    var AVATARS = [
      { file: 'avatar-howard.png', name: 'Howard Ratner', vibe: 'Diamanti grezzi' },
      { file: 'avatar-vader.png', name: 'Darth Vader', vibe: 'Star Wars' },
      { file: 'avatar-strange.png', name: 'Doctor Strange', vibe: 'Doctor Strange' },
      { file: 'avatar-paul-chani.png', name: 'Paul e Chani', vibe: 'Dune' },
      { file: 'avatar-fremen.png', name: 'Fremen', vibe: 'Dune' },
      { file: 'avatar-paul-walk.png', name: 'Muad\'Dib', vibe: 'Dune' }
    ];
    var i = 0;
    var tile = COLORS[0].hex;
    var photo = document.getElementById('photo');
    var nameEl = document.getElementById('name');
    var showEl = document.getElementById('show');
    var meta = document.getElementById('meta');
    var cat = document.getElementById('cat');
    var strip = document.getElementById('strip');
    var mods = document.getElementById('mods');
    var frame = document.getElementById('frame');

    COLORS.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'swatch';
      b.style.background = c.hex;
      b.title = c.label;
      b.setAttribute('aria-label', c.label);
      b.onclick = function (e) {
        e.stopPropagation();
        setTile(c.hex);
      };
      mods.appendChild(b);
    });

    var picker = document.createElement('input');
    picker.type = 'color';
    picker.className = 'custom';
    picker.value = tile;
    picker.title = 'Colore libero';
    picker.setAttribute('aria-label', 'Colore libero');
    picker.oninput = function () { setTile(picker.value); };
    picker.onclick = function (e) { e.stopPropagation(); };
    mods.appendChild(picker);

    AVATARS.forEach(function (p, idx) {
      var b = document.createElement('button');
      b.className = 'thumb';
      var img = document.createElement('img');
      img.src = '/avatars/' + p.file + '?v=cut5';
      img.alt = p.name;
      b.appendChild(img);
      b.onclick = function () { show(idx); };
      strip.appendChild(b);
    });

    function setTile(hex) {
      tile = hex;
      picker.value = hex;
      document.documentElement.style.setProperty('--tile', hex);
      Array.prototype.forEach.call(mods.querySelectorAll('.swatch'), function (el) {
        el.classList.toggle('on', rgbClose(el.style.backgroundColor, hex));
      });
    }

    function rgbClose(cssRgb, hex) {
      var m = cssRgb.match(/\d+/g);
      if (!m || m.length < 3) return false;
      var h = hex.replace('#', '');
      var r = parseInt(h.slice(0, 2), 16);
      var g = parseInt(h.slice(2, 4), 16);
      var b = parseInt(h.slice(4, 6), 16);
      return Number(m[0]) === r && Number(m[1]) === g && Number(m[2]) === b;
    }

    function show(n) {
      i = (n + AVATARS.length) % AVATARS.length;
      var p = AVATARS[i];
      photo.src = '/avatars/' + p.file + '?v=cut5';
      photo.alt = p.name;
      nameEl.textContent = p.name;
      showEl.textContent = p.vibe;
      cat.textContent = p.vibe;
      meta.textContent = (i + 1) + ' / ' + AVATARS.length;
      Array.prototype.forEach.call(strip.children, function (el, idx) {
        el.classList.toggle('on', idx === i);
      });
      var on = strip.children[i];
      if (on && on.scrollIntoView) on.scrollIntoView({ inline: 'center', block: 'nearest' });
    }

    document.getElementById('prev').onclick = function () { show(i - 1); };
    document.getElementById('next').onclick = function () { show(i + 1); };
    frame.onclick = function () { show(i + 1); };
    document.addEventListener('keydown', function (e) {
      if (e.target === picker) return;
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); show(i + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); show(i - 1); }
    });
    setTile(tile);
    show(0);
  </script>
</body>
</html>
