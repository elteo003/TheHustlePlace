<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TheHustlePlace</title>
  <style>
    html, body { margin: 0; background: #000; color: #fff; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; height: 100%; }

    .hist-scroller { height: 236px; }

    .ep-section { padding: 8px 8px 40px; }
    .ep-head { margin: 0 0 18px; }
    .ep-head h2 { display: inline-block; font-size: 26px; margin: 0 16px 0 0; vertical-align: middle; }
    .season-wrap { position: relative; display: inline-block; vertical-align: middle; }
    .season-toggle {
      display: inline-block; height: 44px; line-height: 44px; padding: 0 16px;

    .season-menu {
      position: absolute; left: 0; top: 100%; margin-top: 8px; min-width: 240px; z-index: 8;
      background: #09090b; border: 1px solid rgba(255,255,255,.12); border-radius: 12px; overflow: hidden;
    }
    .season-opt {
      display: block; width: 100%; text-align: left; padding: 14px 18px; box-sizing: border-box;
      color: rgba(255,255,255,.72); font-size: 18px; background: transparent;
    }
    .season-opt.on { background: rgba(255,255,255,.1); color: #fff; }
    .season-opt span { display: block; font-size: 14px; color: rgba(255,255,255,.4); margin-top: 4px; }
    .ep-list { border-top: 1px solid rgba(255,255,255,.1); }
    .ep-row {
      display: -webkit-box; display: flex; -webkit-box-align: start; align-items: flex-start;

      border-bottom: 1px solid rgba(255,255,255,.1);

    .ep-num { width: 36px; -webkit-flex-shrink: 0; flex-shrink: 0; padding-top: 28px; font-size: 20px; color: rgba(255,255,255,.35); }
    .episode-watched .ep-num { color: #fff; }
    .ep-still {
      position: relative; width: 196px; height: 110px; -webkit-flex-shrink: 0; flex-shrink: 0;
      border-radius: 8px; overflow: hidden; background: #181818 center/cover no-repeat;
    }
    .episode-watched .ep-still { box-shadow: 0 0 0 1px rgba(255,255,255,.7); }
    .ep-still:after {
      content: ""; position: absolute; left: 50%; top: 50%; width: 0; height: 0; margin: -10px 0 0 -6px;
      border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 16px solid #fff;
    }
    .ep-still b {
      position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.2);
    }
    .ep-still b i { display: block; height: 100%; background: #fff; }
    .ep-body { -webkit-box-flex: 1; flex: 1; min-width: 0; padding: 0 0 0 18px; }
    .ep-title { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
    .ep-runtime { float: right; font-size: 16px; color: rgba(255,255,255,.4); font-weight: 400; }
    .ep-last { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.8); margin: 0 0 6px; }
    .ep-plot { font-size: 18px; line-height: 1.4; color: rgba(255,255,255,.55); max-height: 4.2em; overflow: hidden; margin: 0; }
    @keyframes episode-light-sweep {
      from { -webkit-transform: translateX(-80%); transform: translateX(-80%); opacity: .85; }
      to { -webkit-transform: translateX(180%); transform: translateX(180%); opacity: 0; }
    }
    .ep-row > * { position: relative; z-index: 1; }
    .episode-watched { position: relative; overflow: hidden; }
    .episode-watched:before {
      content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none;
      background: linear-gradient(90deg, rgba(255,255,255,.2) 0%, rgba(255,255,255,.09) 36%, rgba(255,255,255,.03) 58%, transparent 82%);
    }
    .episode-watched:after {
      content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 42%; pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
      -webkit-transform: translateX(-100%); transform: translateX(-100%);
      -webkit-animation: episode-light-sweep 420ms cubic-bezier(0.19, 1, 0.22, 1) both;
      animation: episode-light-sweep 420ms cubic-bezier(0.19, 1, 0.22, 1) both;
    }
    video { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: #000; }
    .hud { position: fixed; left: 40px; top: 32px; z-index: 5; transition: opacity .35s ease; }
    .hud-hide { opacity: 0; visibility: hidden; }
    .cue {
      position: fixed; left: 50%; top: 40%; z-index: 6; width: 280px; margin-left: -140px;
      text-align: center; font-size: 48px; font-weight: 700; pointer-events: none;
      text-shadow: 0 8px 28px rgba(0,0,0,.8); transition: opacity .25s ease;
    }
    .cue-hide { opacity: 0; }
    .transport {
      position: fixed; left: 64px; right: 64px; bottom: 48px; z-index: 6;
      transition: opacity .3s ease;
    }
    .transport-hide { opacity: 0; visibility: hidden; }
    .tbar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.22); overflow: hidden; }
    .tbar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 99px; }
    .ttime { margin-top: 12px; font-size: 22px; color: rgba(255,255,255,.82); }
    [data-tv-focus] { transition: transform .12s ease, box-shadow .12s ease; }
    .is-tv-focused {
      outline: 4px solid #fff !important; outline-offset: 4px;
      transform: scale(1.06); z-index: 3;
      box-shadow: 0 16px 40px rgba(0,0,0,.45);
    }
    .ep-row.is-tv-focused, .season-toggle.is-tv-focused, .season-opt.is-tv-focused {
      transform: none; box-shadow: none; outline-offset: 2px;
    }
    .ep-row.is-tv-focused { background: rgba(255,255,255,.06); }
    .hint { color: rgba(255,255,255,.5); font-size: 20px; }
    .muted { color: rgba(255,255,255,.5); font-size: 18px; }
    .spinner {
      width: 42px; height: 42px; border: 4px solid rgba(255,255,255,.16); border-top-color: #fff;
      border-radius: 50%; animation: spin .75s linear infinite; margin: 8px 0;

<body>
  <div id="root"></div>
  <script>
(function () {
  var AVATARS = ['#2563eb', '#db2777', '#16a34a', '#ca8a04', '#7c3aed', '#ea580c', '#0d9488', '#e11d48'];
  var KEYS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  var root = document.getElementById('root');
  var nodes = [];
  var idx = 0;
  var wantFid = '';
  var gateView = 'pick';
  var selectedProfile = null;
  var household = { configured: false, profiles: [{ id: 'local', name: 'Ospite', avatar: 0, pairCode: null }] };
  var createName = '';
  var createAvatar = 0;
  var editProfileId = '';
  var adoptCode = '';
  var searchQ = '';
  var searchTab = 'all';
  var searchTimer = null;
  var searchGen = 0;
  var searchMovies = [];
  var searchShows = [];
  var searchLoading = false;
  var backHandler = null;
  var cache = { home: null, movies: null, series: null, history: [] };
  var heroItem = null;
  var playerHud = null;

  function storeGet(key) {
    try { return window.sessionStorage.getItem(key) || ''; } catch (e) { return ''; }
  }
  function storeSet(key, value) {
    try { window.sessionStorage.setItem(key, value || ''); } catch (e) {}
  }

  function readLocalWatch() {
    try {
      var raw = window.localStorage.getItem('thp_watch_history');
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function writeLocalWatch(entry) {
    var list = readLocalWatch();
    var i, found = -1;
    for (i = 0; i < list.length; i++) {
      if (Number(list[i].id) === Number(entry.id) && list[i].type === entry.type) found = i;
    }
    if (found >= 0) list.splice(found, 1);
    list.unshift(entry);
    if (list.length > 12) list = list.slice(0, 12);
    try { window.localStorage.setItem('thp_watch_history', JSON.stringify(list)); } catch (e) {}
  }

  function historyFrom(entries) {
    var out = [];
    var i, e;
    if (!entries) return out;
    for (i = 0; i < entries.length && i < 12; i++) {
      e = entries[i];
      if (!e) continue;
      out.push({
        id: e.id,
        tmdb_id: e.id,
        title: e.title,
        name: e.title,
        overview: e.overview || '',
        poster_path: e.poster_path,
        backdrop_path: e.backdrop_path,
        type: e.type || 'movie',
        contentType: e.type || 'movie',
        progress: e.progress || 0,
        season: e.season,
        episode: e.episode,
        currentTime: e.currentTime || e.position_seconds || 0,
        duration: e.duration,
        watchedAt: e.watchedAt || 0
      });
    }
    return out;
  }

  function mergeHistory(json) {
    var remote = historyFrom((json && json.entries) || []);
    var local = historyFrom(readLocalWatch());
    var map = {};
    var i, key, out;
    for (i = 0; i < remote.length; i++) {
      key = remote[i].type + '-' + remote[i].id;
      map[key] = remote[i];
    }
    for (i = 0; i < local.length; i++) {
      key = local[i].type + '-' + local[i].id;
      if (!map[key] || (local[i].watchedAt || 0) >= (map[key].watchedAt || 0)) map[key] = local[i];
    }
    out = [];
    for (key in map) {
      if (Object.prototype.hasOwnProperty.call(map, key)) out.push(map[key]);
    }
    out.sort(function (a, b) { return (b.watchedAt || 0) - (a.watchedAt || 0); });
    return out.slice(0, 12);
  }

  function rememberPlay(item, type, id) {
    storeSet('tv.play', JSON.stringify({
      id: Number(id),
      type: type,
      title: itemTitle(item) || 'Titolo',
      poster_path: item && item.poster_path,
      backdrop_path: item && item.backdrop_path
    }));
  }

  function playMeta() {
    try { return JSON.parse(storeGet('tv.play') || '{}'); } catch (e) { return {}; }
  }

  function trackWatch(body) {
    writeLocalWatch({
      id: body.id,
      type: body.type,
      title: body.title,
      poster_path: body.poster_path,
      backdrop_path: body.backdrop_path,
      season: body.season,
      episode: body.episode,
      progress: body.progress || 0,
      currentTime: body.position_seconds,
      watchedAt: new Date().getTime()
    });
    cache.home = null;
    cache.series = null;
    postJson('/api/watch-history', body, function () {});
  }
  try {
    var savedHouse = storeGet('tv.house');
    if (savedHouse) {
      var parsedHouse = JSON.parse(savedHouse);
      if (parsedHouse && parsedHouse.profiles && parsedHouse.profiles.length) household = parsedHouse;
    }
  } catch (houseErr) {}

  function pathNow() {
    return (window.location.pathname || '') + (window.location.search || '');
  }

  function go(path) {
    if (path === pathNow()) return;
    if (window.history && window.history.pushState) {
      window.history.pushState({}, '', path);
      route();
    } else {
      window.location.href = path;
    }
  }

  function codeOf(event) {
    return event.keyCode || event.which || 0;
  }

  function qs(name) {
    var raw = (window.location.search || '').replace(/^\?/, '').split('&');
    var i, pair;
    for (i = 0; i < raw.length; i++) {
      pair = raw[i].split('=');
      if (decodeURIComponent(pair[0] || '') === name) return decodeURIComponent(pair[1] || '');
    }
    return '';
  }

  function listOf(payload) {
    if (!payload) return [];
    var data = payload.data !== undefined ? payload.data : payload;
    if (data && data.results) return data.results;
    if (Object.prototype.toString.call(data) === '[object Array]') return data;
    return [];
  }

  function itemId(item) { return item && (item.tmdb_id || item.id); }
  function itemTitle(item) { return (item && (item.title || item.name)) || 'Titolo'; }
  function itemType(item, fallback) { return (item && (item.contentType || item.type)) || fallback || 'movie'; }

  function img(item, size, kind) {
    var path = item && (kind === 'back' ? (item.backdrop_path || item.poster_path) : (item.poster_path || item.backdrop_path));
    if (!path) return '';
    return 'https://image.tmdb.org/t/p/' + (size || 'w300') + path;
  }

  function getJson(url, done) {
    if (!window.fetch) { done(null); return; }
    fetch(url, { credentials: 'same-origin' }).then(function (res) {
      return res.json();
    }).then(done).catch(function () { done(null); });
  }

  function sendJson(method, url, body, done) {
    if (!window.fetch) { done(null); return; }
    fetch(url, {
      method: method,
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },

  function currentFid() {
    return nodes[idx] ? (nodes[idx].getAttribute('data-fid') || '') : '';

    var fid = currentFid();

  function paint() {
    var i, el, cls;
    for (i = 0; i < nodes.length; i++) {
      el = nodes[i];
      cls = (' ' + el.className + ' ').replace(' is-tv-focused ', ' ');
      if (i === idx) cls += 'is-tv-focused';
      el.className = cls.replace(/^\s+|\s+$/g, '');
    }
    if (nodes[idx]) {
      try { nodes[idx].focus(); } catch (err) {}
      try { nodes[idx].scrollIntoView(false); } catch (err2) {}
      peekFrom(nodes[idx]);
    }
  }

  function collect(prefer) {
    var found = root.querySelectorAll('[data-tv-focus]');
    nodes = [];
    var i, fid, pick, def;
    for (i = 0; i < found.length; i++) nodes.push(found[i]);
    fid = prefer || wantFid || storeGet('tv.fid');
    pick = -1;
    def = -1;
    for (i = 0; i < nodes.length; i++) {
      if (fid && nodes[i].getAttribute('data-fid') === fid) pick = i;
      if (def < 0 && nodes[i].getAttribute('data-tv-default') === '1') def = i;
    }
    if (pick < 0) pick = def;
    if (pick < 0) pick = 0;
    idx = pick;
    paint();
  }

  function move(dir) {
    if (!nodes.length) return;
    var cur = nodes[idx].getBoundingClientRect();
    var best = -1;
    var bestScore = 1000000;
    var i, next, dx, dy, primary, side, score;
    for (i = 0; i < nodes.length; i++) {
      if (i === idx) continue;
      next = nodes[i].getBoundingClientRect();
      if (next.width < 2 || next.height < 2) continue;
      dx = (next.left + next.width / 2) - (cur.left + cur.width / 2);
      dy = (next.top + next.height / 2) - (cur.top + cur.height / 2);
      if (dir === 'right') { if (dx <= 2) continue; primary = dx; side = dy < 0 ? -dy : dy; }
      else if (dir === 'left') { if (dx >= -2) continue; primary = -dx; side = dy < 0 ? -dy : dy; }
      else if (dir === 'down') { if (dy <= 2) continue; primary = dy; side = dx < 0 ? -dx : dx; }
      else { if (dy >= -2) continue; primary = -dy; side = dx < 0 ? -dx : dx; }
      score = primary + side * 2.4;
      if (score < bestScore) { bestScore = score; best = i; }
    }
    if (best >= 0) {
      idx = best;
      remember();
      paint();
    }
  }

  function activate() {
    if (!nodes[idx]) return;

  function onKey(event) {
    var c = codeOf(event);
    var key = event.key || '';
    var isBack = c === 461 || c === 27 || key === 'Escape' || key === 'GoBack';
    if (playerHud && playerHud.handleKey && playerHud.handleKey(c, key, isBack)) {
      if (event.preventDefault) event.preventDefault();
      return false;
    }
    if (c === 37 || key === 'ArrowLeft' || key === 'Left') { if (event.preventDefault) event.preventDefault(); move('left'); return false; }
    if (c === 39 || key === 'ArrowRight' || key === 'Right') { if (event.preventDefault) event.preventDefault(); move('right'); return false; }
    if (c === 38 || key === 'ArrowUp' || key === 'Up') { if (event.preventDefault) event.preventDefault(); move('up'); return false; }
    if (c === 40 || key === 'ArrowDown' || key === 'Down') { if (event.preventDefault) event.preventDefault(); move('down'); return false; }
    if (c === 13 || c === 23 || key === 'Enter' || key === 'Select') { if (event.preventDefault) event.preventDefault(); activate(); return false; }
    if (isBack) {
      if (event.preventDefault) event.preventDefault();
      if (backHandler) backHandler();
      else if (window.history) history.back();
      return false;
    }
    return true;
  }

  function makePlaylistUrl(master, parts) {
    var text = master || '';
    var created = [];
    var id, blob, url;
    if (parts) {
      for (id in parts) {
        if (!Object.prototype.hasOwnProperty.call(parts, id)) continue;
        blob = new Blob([parts[id]], { type: 'application/vnd.apple.mpegurl' });
        url = URL.createObjectURL(blob);
        created.push(url);
        text = text.split('__PART__' + id + '.m3u8').join(url);
      }
    }
    blob = new Blob([text], { type: 'application/vnd.apple.mpegurl' });
    url = URL.createObjectURL(blob);
    created.push(url);
    return { url: url, created: created };
  }

  function bestLevel(levels) {
    var best = 0;
    var i, height, bestHeight, bitrate, bestBitrate;
    for (i = 1; i < levels.length; i++) {
      height = levels[i].height || 0;
      bestHeight = levels[best].height || 0;
      bitrate = levels[i].bitrate || 0;
      bestBitrate = levels[best].bitrate || 0;
      if (height > bestHeight || (height === bestHeight && bitrate > bestBitrate)) best = i;
    }
    return best;
  }

        abrEwmaDefaultEstimate: 8000000

      video._tvHls = hls;
      hls.loadSource(playlist);
      hls.attachMedia(video);
      var locked = -1;
      function lockLevel(index) {
        if (!hls.levels || !hls.levels.length) return;
        if (index < 0 || index >= hls.levels.length) return;
        locked = index;
        hls.startLevel = index;
        hls.currentLevel = index;
        hls.nextLevel = index;
        hls.nextLoadLevel = index;
      }
      if (Hls.Events.LEVEL_SWITCHED) {
        hls.on(Hls.Events.LEVEL_SWITCHED, function (_evt, data) {
          if (locked >= 0 && data && data.level !== locked) lockLevel(locked);
        });
      }
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        var levels = hls.levels || [];
        var best = bestLevel(levels);
        lockLevel(best);
        window.setTimeout(function () { lockLevel(best); }, 0);
        window.setTimeout(function () { lockLevel(best); }, 250);
        if (onLevels) onLevels(hls, levels, best, lockLevel);
        playWhenReady(video);
      });
      hls.on(Hls.Events.ERROR, function (_evt, data) {
        if (data && data.fatal && onFail) onFail();
      });
      return;
    }
    if (video.canPlayType && video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = playlist;
      playWhenReady(video);
      return;
    }
    video.src = playlist;
    playWhenReady(video);
  }

  function renderPlayer(type, id) {
    var season = parseInt(qs('season'), 10) || 1;
    var episode = parseInt(qs('episode'), 10) || 1;
    var resumeAt = parseInt(qs('startAt'), 10) || 0;
    var lastTrack = 0;
    var meta = playMeta();
    var hudTimer = null;
    function clearHud() {
      if (hudTimer) window.clearTimeout(hudTimer);
      hudTimer = null;
      playerHud = null;
    }
    backHandler = function () {
      clearHud();
      if (video && video._tvHls && video._tvHls.destroy) video._tvHls.destroy();
      go('/living/' + (type === 'tv' ? 'series/' : 'movie/') + id);
    };
    root.innerHTML = '';
    var video = document.createElement('video');
    video.setAttribute('autoplay', 'autoplay');
    video.setAttribute('playsinline', 'playsinline');
    video.setAttribute('webkit-playsinline', 'true');
    root.appendChild(video);
    var hud = el('div', 'hud');
    hud.appendChild(focusBtn('action', 'Indietro', 'player-back', backHandler, true));
    var qualityCycle = function () {};
    var qualityBtn = focusBtn('action', 'Qualità', 'player-quality', function () { qualityCycle(); });
    qualityBtn.style.display = 'none';
    hud.appendChild(qualityBtn);
    var status = el('div', 'spinner');
    status.id = 'play-status';
    hud.appendChild(status);
    root.appendChild(hud);
    var cue = el('div', 'cue cue-hide');
    cue.id = 'play-cue';
    root.appendChild(cue);
    var transport = el('div', 'transport transport-hide');
    var tbar = el('div', 'tbar');
    var fill = el('i');
    fill.id = 'play-fill';
    tbar.appendChild(fill);
    transport.appendChild(tbar);
    var ttime = el('div', 'ttime', '00:00');
    ttime.id = 'play-time';
    transport.appendChild(ttime);
    root.appendChild(transport);
    collect('player-back');

    var cueTimer = null;
    var barTimer = null;
    var zone = 'hud';
    var userHud = false;
    function fmtTime(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      var h = Math.floor(sec / 3600);
      var m = Math.floor((sec % 3600) / 60);
      var s = sec % 60;
      function z(n) { return (n < 10 ? '0' : '') + n; }
      if (h) return h + ':' + z(m) + ':' + z(s);
      return z(m) + ':' + z(s);
    }
    function syncBar() {
      var d = video.duration;
      var t = video.currentTime || 0;
      if (d && isFinite(d) && d > 0) fill.style.width = Math.min(100, (t / d) * 100) + '%';
      ttime.innerHTML = '';
      ttime.appendChild(document.createTextNode(fmtTime(t) + (d && isFinite(d) ? ' / ' + fmtTime(d) : '')));
    }
    function showCue(text) {
      cue.innerHTML = '';
      cue.appendChild(document.createTextNode(text));
      cue.className = 'cue';
      if (cueTimer) window.clearTimeout(cueTimer);
      cueTimer = window.setTimeout(function () {
        if (!video.paused) cue.className = 'cue cue-hide';
      }, 900);
    }
    function showBar() {
      transport.className = 'transport';
      syncBar();
      if (barTimer) window.clearTimeout(barTimer);
      if (!video.paused) {
        barTimer = window.setTimeout(function () {
          if (!video.paused) transport.className = 'transport transport-hide';
        }, 2800);
      }
    }
    function togglePause() {
      if (video.paused) {
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
        showCue('Play');
      } else {
        video.pause();
        showCue('Pausa');
      }
      showBar();
    }
    function seekBy(delta) {
      var d = video.duration;
      var t = video.currentTime || 0;
      var next = t + delta;
      if (next < 0) next = 0;
      if (d && isFinite(d) && next > d - 0.5) next = Math.max(0, d - 0.5);
      try { video.currentTime = next; } catch (err) {}
      showCue((delta > 0 ? '+' : '') + delta + ' s');
      showBar();
    }
    function hudOnButtons() {
      return zone === 'hud';
    }
    function pokeHud() {
      if (hudTimer) window.clearTimeout(hudTimer);
      hudTimer = window.setTimeout(function () {
        userHud = false;
        zone = 'watch';
        hideHud();
      }, 3500);
    }
    function hideHud() {
      hud.className = 'hud hud-hide';
      if (playerHud) playerHud.hidden = true;
    }
    function showHud() {
      zone = 'hud';
      userHud = true;
      hud.className = 'hud';
      if (playerHud) playerHud.hidden = false;
      var fid = currentFid();
      if (fid !== 'player-back' && fid !== 'player-quality') fid = 'player-back';
      if (qualityBtn.style.display === 'none' && fid === 'player-quality') fid = 'player-back';
      collect(fid);
      pokeHud();
    }
    function enterBar() {
      userHud = false;
      zone = 'bar';
      hideHud();
      showBar();
    }
    function handlePlayerKey(c, key, isBack) {
      if (isBack) return false;
      var left = c === 37 || key === 'ArrowLeft' || key === 'Left';
      var right = c === 39 || key === 'ArrowRight' || key === 'Right';
      var skipBack = c === 412;
      var skipFwd = c === 417;
      var ok = c === 13 || c === 23 || key === 'Enter' || key === 'Select';
      var pauseKey = c === 179 || c === 10252 || key === ' ' || key === 'MediaPlayPause';
      var up = c === 38 || key === 'ArrowUp' || key === 'Up';
      var down = c === 40 || key === 'ArrowDown' || key === 'Down';
      if (c === 19 || key === 'MediaPause') { if (!video.paused) togglePause(); else showBar(); return true; }
      if (c === 415 || key === 'MediaPlay') { if (video.paused) togglePause(); else showBar(); return true; }
      if (skipBack) { seekBy(-10); return true; }
      if (skipFwd) { seekBy(10); return true; }
      if (hudOnButtons()) {
        if (up) { showHud(); return true; }
        if (down) { enterBar(); return true; }
        if (left || right) { pokeHud(); return false; }
        if (ok) { pokeHud(); return false; }
        if (pauseKey) { togglePause(); return true; }
        return false;
      }
      if (left) { zone = 'bar'; seekBy(-10); return true; }
      if (right) { zone = 'bar'; seekBy(10); return true; }
      if (up) { showHud(); return true; }
      if (down) { enterBar(); return true; }
      if (ok || pauseKey) { togglePause(); return true; }
      return false;
    }
    video.addEventListener('timeupdate', syncBar);
    video.addEventListener('seeked', syncBar);
    video.addEventListener('pause', function () {
      showCue('Pausa');
      showBar();
      sendProgress(false);
    });
    video.addEventListener('play', function () {
      if (cue.textContent === 'Pausa') cue.className = 'cue cue-hide';
      showBar();
    });
    video.addEventListener('ended', function () { sendProgress(true); });
    video.addEventListener('timeupdate', function () {
      var now = new Date().getTime();
      if (now - lastTrack < 8000) return;
      lastTrack = now;
      sendProgress(false);
    });
    function applyResume() {
      if (resumeAt > 5) {
        try { video.currentTime = resumeAt; } catch (err) {}
        resumeAt = 0;
      }
    }
    video.addEventListener('loadeddata', applyResume);
    function sendProgress(ended) {
      var d = video.duration;
      var t = video.currentTime || 0;
      var progress;
      if (ended) {
        t = (d && d > 0) ? d : t;
        progress = 100;
      } else {
        if (t < 5) return;
        progress = (d && isFinite(d) && d > 0) ? Math.min(100, Math.round((t / d) * 100)) : 0;
      }
      var body = {
        id: Number(id),
        type: type === 'tv' ? 'tv' : 'movie',
        title: (meta && meta.title) || 'Titolo',
        poster_path: (meta && meta.poster_path) || null,
        backdrop_path: (meta && meta.backdrop_path) || null,
        position_seconds: Math.floor(t),
        progress: progress
      };
      if (type === 'tv') {
        body.season = season;
        body.episode = episode;
      }
      trackWatch(body);
    }
    playerHud = { hidden: false, show: showHud, touch: showHud, dispose: clearHud, handleKey: handlePlayerKey };

    var url = '/api/player/resolve?tmdbId=' + id + '&type=' + type;
    if (type === 'tv') url += '&season=' + season + '&episode=' + episode;

    function showFail(msg) {
      status.className = 'hint';
      status.innerHTML = '';
      status.appendChild(document.createTextNode(msg || 'Il film non parte.'));
      collect('player-back');
    }

    function startWith(master, parts) {
      var source;
      if (master.indexOf('#EXTM3U') === 0 || (parts && typeof parts === 'object')) {
        source = makePlaylistUrl(master, parts);
      } else {
        source = { url: master, created: [] };
      }
      var failed = false;
      function fallbackNative() {
        if (failed) return;
        failed = true;
        if (video._tvHls && video._tvHls.destroy) video._tvHls.destroy();
        video.src = source.url;
        playWhenReady(video);
      }
      attachStream(video, source.url, fallbackNative, function (hls, levels, best, lockLevel) {
        if (!levels || !levels.length) return;
        var order = [];
        var i;
        for (i = 0; i < levels.length; i++) order.push(i);
        order.sort(function (a, b) {
          var dh = (levels[b].height || 0) - (levels[a].height || 0);
          if (dh) return dh;
          return (levels[b].bitrate || 0) - (levels[a].bitrate || 0);
        });
        var qPos = 0;
        for (i = 0; i < order.length; i++) {
          if (order[i] === best) qPos = i;
        }
        function setQualityLabel(index) {
          qualityBtn.innerHTML = '';
          qualityBtn.appendChild(document.createTextNode(levelLabel(levels[index])));
        }
        qualityBtn.style.display = 'inline-block';
        setQualityLabel(best);
        qualityCycle = function () {
          qPos = (qPos + 1) % order.length;
          lockLevel(order[qPos]);
          setQualityLabel(order[qPos]);
          if (playerHud) playerHud.show();
        };
        collect(currentFid() || 'player-back');
      });
      function hideStatus() {
        if (status && status.parentNode) status.parentNode.removeChild(status);
        if (userHud) return;
        zone = 'watch';
        hideHud();
        showBar();
      }
      video.addEventListener('loadeddata', hideStatus);
      video.addEventListener('playing', hideStatus);
      video.addEventListener('error', function () {
        showFail('Il film non parte. Torna indietro e riprova.');
      });
    }

    getJson(url, function (json) {
      var master = json && json.data && json.data.master;
      var parts = json && json.data && json.data.parts;
      if (!master) {
        showFail((json && json.error) || 'Stream non disponibile');
        return;
      }
      function begin() { startWith(master, parts); }
      if (window.Hls) {
        begin();
        return;
      }
      loadScript('https://cdnjs.cloudflare.com/ajax/libs/hls.js/0.14.17/hls.min.js', function (ok) {
        if (!ok) {
          loadScript('https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js', function () { begin(); });
          return;
        }
        begin();
      });
    });
  }

  function route() {
    if (playerHud && playerHud.dispose) playerHud.dispose();
    var parts = (window.location.pathname || '').split('/');
    var section = parts[2] || '';
    var third = parts[3] || '';
    var fourth = parts[4] || '';
    if (!section) {
      renderGate();
      getJson('/api/household', function (data) {
        applyHousehold(data);
        if (gateView === 'pick' && pathNow() === '/living') renderGate();
      });
      return;
    }
    if (section === 'home') return renderBrowse('home');
    if (section === 'movie' && third) return renderDetail('movie', third);
    if (section === 'movies') return renderBrowse('movies');
    if (section === 'series' && third) return renderDetail('tv', third);
    if (section === 'series') return renderBrowse('series');
    if (section === 'search') {
      if (!searchQ) searchQ = storeGet('tv.search');
      return renderSearch();
    }
    if (section === 'player' && third && fourth) return renderPlayer(third === 'tv' ? 'tv' : 'movie', fourth);
    renderGate();
  }

  if (window.addEventListener) {
    window.addEventListener('popstate', function () { route(); }, false);
  }
  getJson('/api/household', function (data) { applyHousehold(data); });
  route();
})();
  </script>
</body>
