<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TheHustlePlace</title>
  <style>
    html, body { margin: 0; background: #000; color: #fff; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; height: 100%; }
    body { overflow: hidden; }
    button { font: inherit; color: inherit; border: 0; background: transparent; cursor: pointer; padding: 0; }
    #root { height: 100%; box-sizing: border-box; }
    @keyframes tvIn { from { opacity: .45; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .shell { height: 100%; display: block; overflow: auto; padding: 32px 64px 80px; box-sizing: border-box; animation: tvIn .2s ease-out; }
    .topnav {
      display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center;
      height: 64px; margin-bottom: 22px;
    }
    .brand {
      display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center;
      font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin-right: 28px; white-space: nowrap;
    }
    .brand i {
      display: inline-block; width: 36px; height: 36px; line-height: 36px; text-align: center;
      border-radius: 8px; background: #fff; color: #111; font-style: normal; font-weight: 700; margin-right: 10px;
    }
    .navbtn {
      display: inline-block; height: 44px; line-height: 44px; padding: 0 20px; margin: 0 6px 0 0;
      border-radius: 999px; font-size: 20px; color: rgba(255,255,255,.62);
      transition: background .16s ease, color .16s ease, transform .12s ease;
    }
    .navbtn.cur { background: #fff; color: #111; font-weight: 700; }
    .who {
      display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center;
      margin-left: auto; height: 44px; padding: 0 16px 0 6px; border-radius: 999px;
      background: rgba(255,255,255,.08); font-size: 18px;
    }
    .who i {
      display: inline-block; width: 32px; height: 32px; line-height: 32px; text-align: center;
      border-radius: 50%; margin-right: 10px; font-style: normal; font-weight: 700;
    }
    .hero {
      position: relative; height: 380px; margin: 0 0 32px; border-radius: 22px; overflow: hidden;
      background: #111 center/cover no-repeat; animation: tvIn .4s ease-out;
    }
    .hero:after {
      content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0;
      background: linear-gradient(90deg, #000 8%, rgba(0,0,0,.72) 42%, transparent 78%),
                  linear-gradient(0deg, #000 0%, transparent 38%);
    }
    .hero-copy { position: absolute; left: 48px; bottom: 36px; right: 36%; z-index: 1; }
    .hero-copy h1 { font-size: 52px; line-height: 1.05; margin: 0 0 14px; font-weight: 700; }
    .hero-copy p { font-size: 20px; line-height: 1.4; color: rgba(255,255,255,.72); max-height: 4.2em; overflow: hidden; margin: 0 0 22px; }
    .action {
      display: inline-block; height: 52px; line-height: 52px; padding: 0 26px; margin: 0 12px 0 0;
      border-radius: 10px; background: rgba(255,255,255,.14); font-size: 20px;
      transition: transform .12s ease, background .16s ease;
    }
    .action.main { background: #fff; color: #111; font-weight: 700; }
    .rail { margin: 0 0 24px; animation: tvIn .32s ease-out; }
    .rail h2 { font-size: 24px; font-weight: 600; margin: 0 0 12px; color: rgba(255,255,255,.9); }
    .scroller { white-space: nowrap; overflow-x: auto; overflow-y: hidden; height: 300px; padding: 12px 8px 8px 4px; }
    .tile {
      display: inline-block; width: 168px; height: 252px; margin: 0 14px 0 0; border-radius: 12px;
      background: #1a1a1a center/cover no-repeat; vertical-align: top; position: relative;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .tile b {
      position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,.2);
    }
    .tile b i { display: block; height: 100%; background: #e50914; }
    .skel-title { width: 220px; height: 22px; border-radius: 8px; margin: 0 0 14px; }
    .shimmer {
      background-image: linear-gradient(90deg, #141414 0%, #2a2a2a 45%, #141414 90%);
      background-size: 200% 100%;
      animation: shimmer 1.4s linear infinite;
    }
    .gate { text-align: center; padding-top: 7vh; }
    .gate h1 { font-size: 52px; margin: 0 0 40px; font-weight: 700; }
    .pcol { display: inline-block; width: 188px; margin: 0 14px 20px; vertical-align: top; text-align: center; }
    .avatar, .plus {
      width: 168px; height: 168px; border-radius: 22px; font-size: 64px; font-weight: 700;
      margin: 0 auto 12px; display: -webkit-box; display: flex;
      -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center;
      text-align: center; line-height: 1;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .plus { border: 3px dashed rgba(255,255,255,.28); color: rgba(255,255,255,.7); background: #141414; }
    .pname { display: block; width: 100%; text-align: center; font-size: 22px; margin: 0 0 10px; white-space: nowrap; overflow: hidden; }
    .pcol .action { display: block; width: 100%; margin: 0 0 8px; padding: 0; height: 44px; line-height: 44px; font-size: 16px; box-sizing: border-box; }
    .swatches { margin: 0 0 18px; }
    .swatch {
      display: inline-block; width: 56px; height: 56px; margin: 0 8px 8px 0; border-radius: 14px;
      vertical-align: top; box-sizing: border-box;
    }
    .swatch.on { box-shadow: 0 0 0 4px #fff; }
    .kb { margin: 8px auto 0; max-width: 480px; text-align: left; }
    .search-keys .kb { margin: 0; }
    .kb-row { white-space: nowrap; margin: 0 0 8px; }
    .key, .key-wide {
      display: inline-block; height: 52px; line-height: 52px; margin: 0 6px 0 0; border-radius: 10px;
      background: rgba(255,255,255,.1); font-size: 22px; font-weight: 700; text-align: center; vertical-align: top;
      transition: transform .12s ease, background .16s ease; box-sizing: border-box;
    }
    .key { width: 62px; }
    .key-wide { min-width: 118px; padding: 0 14px; font-size: 18px; font-weight: 600; }
    .key-wide.main { background: #fff; color: #111; font-weight: 700; }
    .typed { font-size: 40px; letter-spacing: .04em; min-height: 52px; margin: 4px 0 20px; }
    .search-keys .typed { font-size: 30px; letter-spacing: .02em; min-height: 40px; }
    .typed.empty { color: rgba(255,255,255,.28); }
    .code { font-size: 64px; letter-spacing: .16em; margin: 20px 0 28px; }
    .gate-foot { margin-top: 18px; }
    .search-split { display: -webkit-box; display: flex; -webkit-box-align: start; align-items: flex-start; }
    .search-keys { width: 480px; -webkit-flex-shrink: 0; flex-shrink: 0; padding-right: 36px; box-sizing: border-box; }
    .search-pane { -webkit-box-flex: 1; flex: 1; min-width: 0; }
    .search-head { font-size: 28px; font-weight: 600; margin: 0 0 8px; }
    .search-count { font-size: 18px; color: rgba(255,255,255,.5); margin: 0 0 16px; }
    .tab {
      display: inline-block; height: 42px; line-height: 42px; padding: 0 18px; margin: 0 8px 16px 0;
      border-radius: 999px; background: rgba(255,255,255,.08); font-size: 18px;
      transition: background .16s ease, color .16s ease;
    }
    .tab.on { background: #fff; color: #111; font-weight: 700; }
    .poster-grid { padding-top: 6px; }
    .poster-grid .tile { width: 148px; height: 222px; margin: 0 12px 16px 0; }
    .empty { padding: 48px 8px 0; }
    .empty h2 { font-size: 28px; margin: 0 0 10px; }
    .detail { position: relative; min-height: calc(100vh - 72px); border-radius: 22px; overflow: hidden; background: #111 center/cover no-repeat; animation: tvIn .32s ease-out; }
    .detail:after {
      content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0;
      background: linear-gradient(90deg, #000 12%, rgba(0,0,0,.7) 48%, transparent);
    }
    .detail-copy { position: relative; z-index: 1; max-width: 820px; padding: 72px 56px; }
    .detail-copy h1 { font-size: 54px; margin: 0 0 18px; }
    .overview { font-size: 22px; line-height: 1.45; color: rgba(255,255,255,.72); }
    .chip {
      display: inline-block; min-width: 52px; height: 48px; line-height: 48px; padding: 0 14px;
      margin: 0 8px 10px 0; border-radius: 10px; background: rgba(255,255,255,.12); font-size: 20px; text-align: center;
    }
    video { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: #000; }
    .hud { position: fixed; left: 40px; top: 32px; z-index: 5; transition: opacity .35s ease; }
    .hud-hide { opacity: 0; visibility: hidden; }
    [data-tv-focus] { transition: transform .12s ease, box-shadow .12s ease; }
    .is-tv-focused {
      outline: 4px solid #fff !important; outline-offset: 4px;
      transform: scale(1.06); z-index: 3;
      box-shadow: 0 16px 40px rgba(0,0,0,.45);
    }
    .hint { color: rgba(255,255,255,.5); font-size: 20px; }
    .muted { color: rgba(255,255,255,.5); font-size: 18px; }
    .spinner {
      width: 42px; height: 42px; border: 4px solid rgba(255,255,255,.16); border-top-color: #fff;
      border-radius: 50%; animation: spin .75s linear infinite; margin: 8px 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
(function () {
  var AVATARS = ['#2563eb', '#db2777', '#16a34a', '#ca8a04', '#7c3aed', '#ea580c', '#0d9488', '#e11d48'];
  var KEYS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  var root = document.getElementById('root');
  var nodes = [];
  var idx = 0;
  var wantFid = '';
  var gateView = 'pick';
  var selectedProfile = null;
  var household = { configured: false, profiles: [{ id: 'local', name: 'Ospite', avatar: 0, pairCode: null }] };
  var createName = '';
  var createAvatar = 0;
  var editProfileId = '';
  var adoptCode = '';
  var searchQ = '';
  var searchTab = 'all';
  var searchTimer = null;
  var searchGen = 0;
  var searchMovies = [];
  var searchShows = [];
  var searchLoading = false;
  var backHandler = null;
  var cache = { home: null, movies: null, series: null, history: [] };
  var heroItem = null;
  var playerHud = null;

  function storeGet(key) {
    try { return window.sessionStorage.getItem(key) || ''; } catch (e) { return ''; }
  }
  function storeSet(key, value) {
    try { window.sessionStorage.setItem(key, value || ''); } catch (e) {}
  }
  try {
    var savedHouse = storeGet('tv.house');
    if (savedHouse) {
      var parsedHouse = JSON.parse(savedHouse);
      if (parsedHouse && parsedHouse.profiles && parsedHouse.profiles.length) household = parsedHouse;
    }
  } catch (houseErr) {}

  function pathNow() {
    return (window.location.pathname || '') + (window.location.search || '');
  }

  function go(path) {
    if (path === pathNow()) return;
    if (window.history && window.history.pushState) {
      window.history.pushState({}, '', path);
      route();
    } else {
      window.location.href = path;
    }
  }

  function codeOf(event) {
    return event.keyCode || event.which || 0;
  }

  function qs(name) {
    var raw = (window.location.search || '').replace(/^\?/, '').split('&');
    var i, pair;
    for (i = 0; i < raw.length; i++) {
      pair = raw[i].split('=');
      if (decodeURIComponent(pair[0] || '') === name) return decodeURIComponent(pair[1] || '');
    }
    return '';
  }

  function listOf(payload) {
    if (!payload) return [];
    var data = payload.data !== undefined ? payload.data : payload;
    if (data && data.results) return data.results;
    if (Object.prototype.toString.call(data) === '[object Array]') return data;
    return [];
  }

  function itemId(item) { return item && (item.tmdb_id || item.id); }
  function itemTitle(item) { return (item && (item.title || item.name)) || 'Titolo'; }
  function itemType(item, fallback) { return (item && (item.contentType || item.type)) || fallback || 'movie'; }

  function img(item, size, kind) {
    var path = item && (kind === 'back' ? (item.backdrop_path || item.poster_path) : (item.poster_path || item.backdrop_path));
    if (!path) return '';
    return 'https://image.tmdb.org/t/p/' + (size || 'w300') + path;
  }

  function getJson(url, done) {
    if (!window.fetch) { done(null); return; }
    fetch(url, { credentials: 'same-origin' }).then(function (res) {
      return res.json();
    }).then(done).catch(function () { done(null); });
  }

  function sendJson(method, url, body, done) {
    if (!window.fetch) { done(null); return; }
    fetch(url, {
      method: method,
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (res) { return res.json(); }).then(done).catch(function () { done(null); });
  }

  function postJson(url, body, done) {
    sendJson('POST', url, body, done);
  }

  function patchJson(url, body, done) {
    sendJson('PATCH', url, body, done);
  }

  function currentFid() {
    return nodes[idx] ? (nodes[idx].getAttribute('data-fid') || '') : '';
  }

  function remember() {
    var fid = currentFid();
    if (fid) {
      wantFid = fid;
      storeSet('tv.fid', fid);
    }
  }

  function paint() {
    var i, el, cls;
    for (i = 0; i < nodes.length; i++) {
      el = nodes[i];
      cls = (' ' + el.className + ' ').replace(' is-tv-focused ', ' ');
      if (i === idx) cls += 'is-tv-focused';
      el.className = cls.replace(/^\s+|\s+$/g, '');
    }
    if (nodes[idx]) {
      try { nodes[idx].focus(); } catch (err) {}
      try { nodes[idx].scrollIntoView(false); } catch (err2) {}
      peekFrom(nodes[idx]);
    }
  }

  function collect(prefer) {
    var found = root.querySelectorAll('[data-tv-focus]');
    nodes = [];
    var i, fid, pick, def;
    for (i = 0; i < found.length; i++) nodes.push(found[i]);
    fid = prefer || wantFid || storeGet('tv.fid');
    pick = -1;
    def = -1;
    for (i = 0; i < nodes.length; i++) {
      if (fid && nodes[i].getAttribute('data-fid') === fid) pick = i;
      if (def < 0 && nodes[i].getAttribute('data-tv-default') === '1') def = i;
    }
    if (pick < 0) pick = def;
    if (pick < 0) pick = 0;
    idx = pick;
    paint();
  }

  function move(dir) {
    if (!nodes.length) return;
    var cur = nodes[idx].getBoundingClientRect();
    var best = -1;
    var bestScore = 1000000;
    var i, next, dx, dy, primary, side, score;
    for (i = 0; i < nodes.length; i++) {
      if (i === idx) continue;
      next = nodes[i].getBoundingClientRect();
      dx = (next.left + next.width / 2) - (cur.left + cur.width / 2);
      dy = (next.top + next.height / 2) - (cur.top + cur.height / 2);
      if (dir === 'right') { if (dx <= 2) continue; primary = dx; side = dy < 0 ? -dy : dy; }
      else if (dir === 'left') { if (dx >= -2) continue; primary = -dx; side = dy < 0 ? -dy : dy; }
      else if (dir === 'down') { if (dy <= 2) continue; primary = dy; side = dx < 0 ? -dx : dx; }
      else { if (dy >= -2) continue; primary = -dy; side = dx < 0 ? -dx : dx; }
      score = primary + side * 2.4;
      if (score < bestScore) { bestScore = score; best = i; }
    }
    if (best >= 0) {
      idx = best;
      remember();
      paint();
    }
  }

  function activate() {
    if (!nodes[idx]) return;
    remember();
    if (nodes[idx].click) nodes[idx].click();
  }

  function onKey(event) {
    var c = codeOf(event);
    var key = event.key || '';
    var isBack = c === 461 || c === 27 || key === 'Escape' || key === 'GoBack';
    if (playerHud && playerHud.hidden && !isBack) {
      if (event.preventDefault) event.preventDefault();
      playerHud.show();
      return false;
    }
    if (playerHud && !isBack) playerHud.touch();
    if (c === 37 || key === 'ArrowLeft' || key === 'Left') { if (event.preventDefault) event.preventDefault(); move('left'); return false; }
    if (c === 39 || key === 'ArrowRight' || key === 'Right') { if (event.preventDefault) event.preventDefault(); move('right'); return false; }
    if (c === 38 || key === 'ArrowUp' || key === 'Up') { if (event.preventDefault) event.preventDefault(); move('up'); return false; }
    if (c === 40 || key === 'ArrowDown' || key === 'Down') { if (event.preventDefault) event.preventDefault(); move('down'); return false; }
    if (c === 13 || c === 23 || key === 'Enter' || key === 'Select') { if (event.preventDefault) event.preventDefault(); activate(); return false; }
    if (c === 461 || c === 27 || key === 'Escape' || key === 'GoBack') {
      if (event.preventDefault) event.preventDefault();
      if (backHandler) backHandler();
      else if (window.history) history.back();
      return false;
    }
    return true;
  }

  document.onkeydown = onKey;

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.appendChild(document.createTextNode(text));
    return node;
  }

  function focusBtn(className, text, fid, onClick, isDefault) {
    var node = el('button', className, text);
    node.type = 'button';
    node.setAttribute('data-tv-focus', '');
    if (fid) node.setAttribute('data-fid', fid);
    if (isDefault) node.setAttribute('data-tv-default', '1');
    node.onclick = function (event) {
      if (event && event.preventDefault) event.preventDefault();
      wantFid = fid || currentFid();
      onClick();
    };
    return node;
  }

  function applyHousehold(data) {
    if (!data || !data.profiles || !data.profiles.length) return;
    household = data;
    storeSet('tv.house', JSON.stringify({
      configured: data.configured,
      householdId: data.householdId,
      activeProfileId: data.activeProfileId,
      profiles: data.profiles
    }));
  }

  function activeProfile() {
    var i, id;
    id = household.activeProfileId;
    for (i = 0; i < household.profiles.length; i++) {
      if (household.profiles[i].id === id) return household.profiles[i];
    }
    return household.profiles[0];
  }

  function enterProfile(profile) {
    if (!profile) return;
    wantFid = '';
    storeSet('tv.fid', 'hero-play');
    if (profile.id === 'local') { go('/living/home'); return; }
    postJson('/api/household/switch', { profileId: profile.id }, function () {
      go('/living/home');
    });
  }

  function renderNav(active) {
    var nav = el('div', 'topnav');
    var brand = el('div', 'brand');
    brand.appendChild(el('i', '', 'H'));
    brand.appendChild(document.createTextNode('TheHustlePlace'));
    nav.appendChild(brand);
    function add(label, path, id) {
      var btn = focusBtn('navbtn' + (id === active ? ' cur' : ''), label, 'nav-' + id, function () {
        if (path === pathNow()) return;
        wantFid = id === 'search' ? (searchQ ? 'key-A' : 'key-A') : 'hero-play';
        if (id === 'movies' || id === 'series') wantFid = 'tile-0';
        go(path);
      });
      nav.appendChild(btn);
    }
    add('Home', '/living/home', 'home');
    add('Film', '/living/movies', 'movies');
    add('Serie', '/living/series', 'series');
    add('Cerca', '/living/search', 'search');
    var who = activeProfile();
    var whoBtn = focusBtn('who', '', 'nav-profile', function () { go('/living'); });
    var av = el('i', '', (who.name || 'P').charAt(0).toUpperCase());
    av.style.background = AVATARS[who.avatar || 0] || AVATARS[0];
    whoBtn.appendChild(av);
    whoBtn.appendChild(document.createTextNode(who.name || 'Profilo'));
    nav.appendChild(whoBtn);
    return nav;
  }

  function peekFrom(node) {
    if (!node || node.getAttribute('data-kind') !== 'tile') return;
    heroItem = {
      id: node.getAttribute('data-id'),
      type: node.getAttribute('data-type') || 'movie',
      title: node.getAttribute('data-title') || '',
      overview: node.getAttribute('data-overview') || '',
      backdrop: node.getAttribute('data-back') || '',
      poster: node.getAttribute('data-poster') || ''
    };
    var hero = document.getElementById('hero');
    if (!hero) return;
    if (heroItem.backdrop || heroItem.poster) {
      hero.style.backgroundImage = 'url(' + (heroItem.backdrop || heroItem.poster) + ')';
    }
    var title = document.getElementById('hero-title');
    var plot = document.getElementById('hero-plot');
    if (title) title.innerHTML = '';
    if (title) title.appendChild(document.createTextNode(heroItem.title || 'TheHustlePlace'));
    if (plot) {
      plot.innerHTML = '';
      plot.appendChild(document.createTextNode(heroItem.overview || ''));
    }
  }

  function fillHero(box, item) {
    var src = (item && (item.backdrop || item.poster)) || '';
    box.style.backgroundImage = src ? 'url(' + src + ')' : '';
    var copy = el('div', 'hero-copy');
    var title = el('h1', '', item && item.title ? item.title : 'TheHustlePlace');
    title.id = 'hero-title';
    var plot = el('p', '', item && item.overview ? item.overview : 'Scegli un titolo con le frecce, OK per aprire.');
    plot.id = 'hero-plot';
    copy.appendChild(title);
    copy.appendChild(plot);
    if (item && item.id) {
      copy.appendChild(focusBtn('action main', 'Riproduci', 'hero-play', function () {
        if (!heroItem || !heroItem.id) return;
        if (heroItem.type === 'tv') openDetail('tv', heroItem.id);
        else openPlay('movie', heroItem.id);
      }, true));
      copy.appendChild(focusBtn('action', 'Scheda', 'hero-info', function () {
        if (heroItem && heroItem.id) openDetail(heroItem.type, heroItem.id);
      }));
    }
    box.appendChild(copy);
  }

  function openDetail(type, id) {
    go('/living/' + (type === 'tv' ? 'series/' : 'movie/') + id);
  }

  function firstEpisode(seasons) {
    var s, e, season, ep;
    for (s = 0; s < (seasons || []).length; s++) {
      season = seasons[s];
      if (!season || !season.episodes || !season.episodes.length) continue;
      if (Number(season.season_number) === 0) continue;
      ep = season.episodes[0];
      return {
        season: Number(season.season_number) || 1,
        episode: Number(ep.episode_number) || 1
      };
    }
    return null;
  }

  function openPlay(type, id, season, episode) {
    if (type === 'tv') {
      if (!season || !episode) {
        openDetail('tv', id);
        return;
      }
      go('/living/player/tv/' + id + '?season=' + season + '&episode=' + episode);
    } else {
      go('/living/player/movie/' + id);

      gateView = 'pick';
      wantFid = 'profile-local';

      return;

    var body = isNew
      ? { name: name, avatar: createAvatar }
      : { profileId: editProfileId, name: name, avatar: createAvatar };
    var send = isNew ? postJson : patchJson;
    send('/api/household/profiles', body, function (data) {
      if (data && data.profiles) applyHousehold(data);
      else if (!isNew) {
        var i;
        for (i = 0; i < household.profiles.length; i++) {
          if (household.profiles[i].id === editProfileId) {
            household.profiles[i].name = name;
            household.profiles[i].avatar = createAvatar;

  function renderBrowse(kind) {

      paintBrowse(kind, cache[kind]);

    root.innerHTML = '';
    var page = el('div', 'shell');
    page.appendChild(renderNav(kind));
    skeletonBrowse(page);
    root.appendChild(page);
    collect('nav-' + kind);

    if (kind === 'movies') {
      getJson('/api/catalog/popular/movies', function (a) {
        getJson('/api/catalog/latest/movies', function (b) {
          cache.movies = { top: [], movies: listOf(a), recent: listOf(b), tv: [], tvRecent: [], history: [] };
          paintBrowse('movies', cache.movies);
        });
      });
      return;
    }
    if (kind === 'series') {
      getJson('/api/catalog/popular/tv', function (a) {
        getJson('/api/catalog/latest/tv', function (b) {
          cache.series = { top: [], movies: [], recent: [], tv: listOf(a), tvRecent: listOf(b), history: [] };
          paintBrowse('series', cache.series);
        });
      });
      return;
    }

    var bag = { top: [], movies: [], recent: [], tv: [], tvRecent: [], history: [] };
    var left = 6;
    function step() {
      left -= 1;
      if (left > 0) return;
      cache.home = bag;
      paintBrowse('home', bag);
    }
    getJson('/api/watch-history', function (json) { bag.history = historyItems(json); step(); });
    getJson('/api/catalog/top-10', function (json) { bag.top = listOf(json); step(); });
    getJson('/api/catalog/popular/movies', function (json) { bag.movies = listOf(json); step(); });
    getJson('/api/catalog/latest/movies', function (json) { bag.recent = listOf(json); step(); });
    getJson('/api/catalog/popular/tv', function (json) { bag.tv = listOf(json); step(); });
    getJson('/api/catalog/latest/tv', function (json) { bag.tvRecent = listOf(json); step(); });

  function runSearch() {
    var q = searchQ.replace(/^\s+|\s+$/g, '');
    searchGen += 1;
    var gen = searchGen;
    if (!q) {
      searchMovies = [];
      searchShows = [];
      searchLoading = false;
      fillSearchPane();
      return;
    }
    searchLoading = true;
    fillSearchPane();
    getJson('/api/catalog/search/movies?query=' + encodeURIComponent(q), function (movies) {
      getJson('/api/catalog/search/tv?query=' + encodeURIComponent(q), function (shows) {
        if (gen !== searchGen) return;
        if (pathNow().indexOf('/living/search') !== 0) return;
        searchMovies = listOf(movies);
        searchShows = listOf(shows);
        searchLoading = false;
        fillSearchPane();
      });
    });
  }

  function renderDetail(type, id) {
    backHandler = function () { go('/living/home'); };
    root.innerHTML = '';
    var page = el('div', 'shell');
    page.appendChild(renderNav(type === 'tv' ? 'series' : 'movies'));
    page.appendChild(el('div', 'hero shimmer'));
    root.appendChild(page);
    collect('nav-' + (type === 'tv' ? 'series' : 'movies'));
    var path = type === 'tv' ? '/api/tmdb/tv/' + id : '/api/tmdb/movies/' + id;
    getJson(path, function (json) {
      var item = json && json.data ? json.data : json;
      root.innerHTML = '';
      page = el('div', 'shell');
      page.appendChild(renderNav(type === 'tv' ? 'series' : 'movies'));
      if (!item) {
        page.appendChild(el('h1', '', 'Non trovato'));
        page.appendChild(focusBtn('action', 'Indietro', 'detail-back', function () { go('/living/home'); }, true));
        root.appendChild(page);
        collect('detail-back');
        return;
      }
      var stage = el('div', 'detail');
      if (img(item, 'original', 'back')) stage.style.backgroundImage = 'url(' + img(item, 'original', 'back') + ')';
      var copy = el('div', 'detail-copy');
      copy.appendChild(el('h1', '', itemTitle(item)));
      copy.appendChild(el('p', 'overview', item.overview || ''));
      var startAt = null;
      copy.appendChild(focusBtn('action main', type === 'tv' ? 'Riproduci' : 'Riproduci', 'detail-play', function () {
        if (type === 'tv') {
          if (startAt) openPlay('tv', id, startAt.season, startAt.episode);
          return;
        }
        openPlay('movie', id);
      }, true));
      copy.appendChild(focusBtn('action', 'Indietro', 'detail-back', function () { go('/living/home'); }));
      stage.appendChild(copy);
      page.appendChild(stage);
      root.appendChild(page);
      collect('detail-play');
      if (type !== 'tv') return;
      getJson('/api/tmdb/tv/' + id + '/seasons', function (seasonJson) {
        var seasons = listOf(seasonJson);
        var s, e, season, episode, btn, keep;
        startAt = firstEpisode(seasons);
        keep = currentFid() || 'detail-play';
        for (s = 0; s < seasons.length && s < 8; s++) {
          season = seasons[s];
          if (!season || !season.episodes || Number(season.season_number) === 0) continue;
          copy.appendChild(el('p', 'muted', 'Stagione ' + (season.season_number || s + 1)));
          for (e = 0; e < season.episodes.length && e < 16; e++) {
            episode = season.episodes[e];
            btn = focusBtn('chip', String(episode.episode_number || e + 1), 'ep-' + s + '-' + e, (function (sn, en) {
              return function () { openPlay('tv', id, sn, en); };
            })(season.season_number, episode.episode_number || e + 1));
            copy.appendChild(btn);
          }
        }
        collect(keep);
      });
    });
  }

  function loadScript(src, done) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = function () { done(true); };
    s.onerror = function () { done(false); };
    document.body.appendChild(s);
  }

  function makePlaylistUrl(master, parts) {
    var text = master || '';
    var created = [];
    var id, blob, url;
    if (parts) {
      for (id in parts) {
        if (!Object.prototype.hasOwnProperty.call(parts, id)) continue;
        blob = new Blob([parts[id]], { type: 'application/vnd.apple.mpegurl' });
        url = URL.createObjectURL(blob);
        created.push(url);
        text = text.split('__PART__' + id + '.m3u8').join(url);
      }
    }
    blob = new Blob([text], { type: 'application/vnd.apple.mpegurl' });
    url = URL.createObjectURL(blob);
    created.push(url);
    return { url: url, created: created };
  }

  function playWhenReady(video) {
    var p = video.play && video.play();
    if (p && p.catch) p.catch(function () {});
  }

  function bestLevel(levels) {
    var best = 0;
    var i, height, bestHeight, bitrate, bestBitrate;
    for (i = 1; i < levels.length; i++) {
      height = levels[i].height || 0;
      bestHeight = levels[best].height || 0;
      bitrate = levels[i].bitrate || 0;
      bestBitrate = levels[best].bitrate || 0;
      if (height > bestHeight || (height === bestHeight && bitrate > bestBitrate)) best = i;
    }
    return best;
  }

  function levelLabel(level) {
    if (!level) return 'Auto';
    if (level.height) return level.height + 'p';
    if (level.bitrate) return Math.round(level.bitrate / 1000) + 'k';
    return 'HQ';
  }

  function attachStream(video, playlist, onFail, onLevels) {
    if (window.Hls && Hls.isSupported()) {
      var hls = new Hls({
        enableWorker: false,
        maxBufferLength: 30,
        testBandwidth: false,
        capLevelToPlayerSize: false,
        abrEwmaDefaultEstimate: 8000000
      });
      video._tvHls = hls;
      hls.loadSource(playlist);
      hls.attachMedia(video);
      var locked = -1;
      function lockLevel(index) {
        if (!hls.levels || !hls.levels.length) return;
        if (index < 0 || index >= hls.levels.length) return;
        locked = index;
        hls.startLevel = index;
        hls.currentLevel = index;
        hls.nextLevel = index;
        hls.nextLoadLevel = index;
      }
      if (Hls.Events.LEVEL_SWITCHED) {
        hls.on(Hls.Events.LEVEL_SWITCHED, function (_evt, data) {
          if (locked >= 0 && data && data.level !== locked) lockLevel(locked);
        });
      }
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        var levels = hls.levels || [];
        var best = bestLevel(levels);
        lockLevel(best);
        window.setTimeout(function () { lockLevel(best); }, 0);
        window.setTimeout(function () { lockLevel(best); }, 250);
        if (onLevels) onLevels(hls, levels, best, lockLevel);
        playWhenReady(video);
      });
      hls.on(Hls.Events.ERROR, function (_evt, data) {
        if (data && data.fatal && onFail) onFail();
      });
      return;
    }
    if (video.canPlayType && video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = playlist;
      playWhenReady(video);
      return;
    }
    video.src = playlist;
    playWhenReady(video);
  }

  function renderPlayer(type, id) {
    var season = parseInt(qs('season'), 10) || 1;
    var episode = parseInt(qs('episode'), 10) || 1;
    var hudTimer = null;
    function clearHud() {
      if (hudTimer) window.clearTimeout(hudTimer);
      hudTimer = null;
      playerHud = null;
    }
    backHandler = function () {
      clearHud();
      if (video && video._tvHls && video._tvHls.destroy) video._tvHls.destroy();
      go('/living/' + (type === 'tv' ? 'series/' : 'movie/') + id);
    };
    root.innerHTML = '';
    var video = document.createElement('video');
    video.setAttribute('autoplay', 'autoplay');
    video.setAttribute('controls', 'controls');
    video.setAttribute('playsinline', 'playsinline');
    video.setAttribute('webkit-playsinline', 'true');
    root.appendChild(video);
    var hud = el('div', 'hud');
    hud.appendChild(focusBtn('action', 'Indietro', 'player-back', backHandler, true));
    var qualityCycle = function () {};
    var qualityBtn = focusBtn('action', 'Qualità', 'player-quality', function () { qualityCycle(); });
    qualityBtn.style.display = 'none';
    hud.appendChild(qualityBtn);
    var status = el('div', 'spinner');
    status.id = 'play-status';
    hud.appendChild(status);
    root.appendChild(hud);
    collect('player-back');

    function hideHud() {
      if (status && status.parentNode) return;
      hud.className = 'hud hud-hide';
      if (playerHud) playerHud.hidden = true;
    }
    function showHud() {
      hud.className = 'hud';
      if (playerHud) playerHud.hidden = false;
      collect(currentFid() || 'player-back');
      if (hudTimer) window.clearTimeout(hudTimer);
      hudTimer = window.setTimeout(hideHud, 3500);
    }
    playerHud = { hidden: false, show: showHud, touch: showHud, dispose: clearHud };

    var url = '/api/player/resolve?tmdbId=' + id + '&type=' + type;
    if (type === 'tv') url += '&season=' + season + '&episode=' + episode;

    function showFail(msg) {
      status.className = 'hint';
      status.innerHTML = '';
      status.appendChild(document.createTextNode(msg || 'Il film non parte.'));
      collect('player-back');
    }

    function startWith(master, parts) {
      var source;
      if (master.indexOf('#EXTM3U') === 0 || (parts && typeof parts === 'object')) {
        source = makePlaylistUrl(master, parts);
      } else {
        source = { url: master, created: [] };
      }
      var failed = false;
      function fallbackNative() {
        if (failed) return;
        failed = true;
        if (video._tvHls && video._tvHls.destroy) video._tvHls.destroy();
        video.src = source.url;
        playWhenReady(video);
      }
      attachStream(video, source.url, fallbackNative, function (hls, levels, best, lockLevel) {
        if (!levels || !levels.length) return;
        var order = [];
        var i;
        for (i = 0; i < levels.length; i++) order.push(i);
        order.sort(function (a, b) {
          var dh = (levels[b].height || 0) - (levels[a].height || 0);
          if (dh) return dh;
          return (levels[b].bitrate || 0) - (levels[a].bitrate || 0);
        });
        var qPos = 0;
        for (i = 0; i < order.length; i++) {
          if (order[i] === best) qPos = i;
        }
        function setQualityLabel(index) {
          qualityBtn.innerHTML = '';
          qualityBtn.appendChild(document.createTextNode(levelLabel(levels[index])));
        }
        qualityBtn.style.display = 'inline-block';
        setQualityLabel(best);
        qualityCycle = function () {
          qPos = (qPos + 1) % order.length;
          lockLevel(order[qPos]);
          setQualityLabel(order[qPos]);
          if (playerHud) playerHud.show();
        };
        collect(currentFid() || 'player-back');
      });
      function hideStatus() {
        if (status && status.parentNode) status.parentNode.removeChild(status);
        if (playerHud) playerHud.touch();
      }
      video.addEventListener('loadeddata', hideStatus);
      video.addEventListener('playing', hideStatus);
      video.addEventListener('error', function () {
        showFail('Il film non parte. Torna indietro e riprova.');
      });
    }

    getJson(url, function (json) {
      var master = json && json.data && json.data.master;
      var parts = json && json.data && json.data.parts;
      if (!master) {
        showFail((json && json.error) || 'Stream non disponibile');
        return;
      }
      function begin() { startWith(master, parts); }
      if (window.Hls) {
        begin();
        return;
      }
      loadScript('https://cdnjs.cloudflare.com/ajax/libs/hls.js/0.14.17/hls.min.js', function (ok) {
        if (!ok) {
          loadScript('https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js', function () { begin(); });
          return;
        }
        begin();
      });
    });
  }

  function route() {
    if (playerHud && playerHud.dispose) playerHud.dispose();
    var parts = (window.location.pathname || '').split('/');
    var section = parts[2] || '';
    var third = parts[3] || '';
    var fourth = parts[4] || '';
    if (!section) {
      renderGate();
      getJson('/api/household', function (data) {
        applyHousehold(data);
        if (gateView === 'pick' && pathNow() === '/living') renderGate();
      });
      return;
    }
    if (section === 'home') return renderBrowse('home');
    if (section === 'movie' && third) return renderDetail('movie', third);
    if (section === 'movies') return renderBrowse('movies');
    if (section === 'series' && third) return renderDetail('tv', third);
    if (section === 'series') return renderBrowse('series');
    if (section === 'search') {
      if (!searchQ) searchQ = storeGet('tv.search');
      return renderSearch();
    }
    if (section === 'player' && third && fourth) return renderPlayer(third === 'tv' ? 'tv' : 'movie', fourth);
    renderGate();
  }

  if (window.addEventListener) {
    window.addEventListener('popstate', function () { route(); }, false);
  }
  getJson('/api/household', function (data) { applyHousehold(data); });
  route();
})();
  </script>
</body>
