name: CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm

            - run: npm ci

            - run: npm run test

            - run: npx playwright install --with-deps chromium

            - run: npm run test:e2e:prod
              env:
                  CI: true
                  E2E_PROD: '1'
                  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
